name: CarrySplits

options:
  bundleIdPrefix: com.m4ckdev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

configs:
  Debug: debug
  Release: release

targets:
  CarrySplits:
    type: application
    platform: iOS
    sources:
      - path: CarrySplits
        excludes:
          - Resources/Info.plist
    resources:
      - path: CarrySplits/Resources/Assets.xcassets
    info:
      path: CarrySplits/Resources/Info.plist
      properties:
        CFBundleDisplayName: Carry Splits
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.m4ckdev.CarrySplits
        PRODUCT_NAME: CarrySplits
        PRODUCT_MODULE_NAME: CarrySplits
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  CarrySplitsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CarrySplitsTests
        excludes:
          - README.md
    dependencies:
      - target: CarrySplits
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.m4ckdev.CarrySplitsTests
        PRODUCT_NAME: CarrySplitsTests
        GENERATE_INFOPLIST_FILE: YES

  CarrySplitsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CarrySplitsUITests
        excludes:
          - README.md
    dependencies:
      - target: CarrySplits
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.m4ckdev.CarrySplitsUITests
        PRODUCT_NAME: CarrySplitsUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CarrySplits

schemes:
  CarrySplits:
    build:
      targets:
        CarrySplits: all
        CarrySplitsTests:
          - test
        CarrySplitsUITests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: CarrySplitsTests
        - name: CarrySplitsUITests
    archive:
      config: Release
