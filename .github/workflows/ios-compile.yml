name: iOS Compile Gate

on:
  push:
    branches:
      - main
    paths:
      - project.yml
      - CarrySplits/**
      - CarrySplitsTests/**
      - CarrySplitsUITests/**
      - scripts/generate_app_icon.swift
      - .github/workflows/ios-compile.yml
  workflow_dispatch:

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate icon and Xcode project
        run: |
          set -euo pipefail
          ICON_DIR="CarrySplits/Resources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          swift scripts/generate_app_icon.swift "$ICON_DIR/AppIcon-1024.png"
          sips -z 40 40 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-20@2x.png" >/dev/null
          sips -z 60 60 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-20@3x.png" >/dev/null
          sips -z 58 58 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-29@2x.png" >/dev/null
          sips -z 87 87 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-29@3x.png" >/dev/null
          sips -z 80 80 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-40@2x.png" >/dev/null
          sips -z 120 120 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-40@3x.png" >/dev/null
          sips -z 120 120 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-60@2x.png" >/dev/null
          sips -z 180 180 "$ICON_DIR/AppIcon-1024.png" --out "$ICON_DIR/AppIcon-60@3x.png" >/dev/null
          xcodegen generate

      - name: Compile app and test bundles
        run: |
          set -o pipefail
          xcodebuild \
            -project CarrySplits.xcodeproj \
            -scheme CarrySplits \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee xcode-compile.log

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carry-splits-xcode-compile-log
          path: xcode-compile.log
          if-no-files-found: warn
